<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواعيد والحجوزات | BarberPro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/appointments.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
    <main class="appointments-page">
        <header class="appointments-header">
            <a href="/" class="back-link">العودة للوحة التحكم</a>
            <h1>المواعيد والحجوزات</h1>
            <p>إدارة حجوزات الصالون ومتابعة مواعيد العملاء</p>
        </header>

        <section class="appointments-stats">
            <article><span>إجمالي الحجوزات</span><strong id="totalBookings">0</strong></article>
            <article><span>حجوزات اليوم</span><strong id="todayBookings">0</strong></article>
            <article><span>قيد الانتظار</span><strong id="pendingBookings">0</strong></article>
            <article><span>حجوزات مكتملة</span><strong id="completedBookings">0</strong></article>
        </section>

        <section class="appointments-panel">
            <h2>إضافة حجز جديد</h2>
            <form id="bookingForm">
                <label>اسم العميل</label>
                <input id="customerName" required placeholder="اسم العميل">

                <label>رقم الهاتف</label>
                <input id="customerPhone" type="tel" required placeholder="رقم الهاتف">

                <label>الخدمة</label>
                <select id="bookingService" required>
                    <option value="">اختر الخدمة</option>
                </select>

                <label>الموظف</label>
                <select id="bookingEmployee" required>
                    <option value="">اختر الموظف</option>
                </select>

                <label>تاريخ الحجز</label>
                <input id="bookingDate" type="date" required>

                <label>وقت الحجز</label>
                <input id="bookingTime" type="time" required>

                <label>ملاحظات</label>
                <textarea id="bookingNotes" rows="3" placeholder="ملاحظات إضافية"></textarea>

                <button type="submit" id="saveBooking">حفظ الحجز</button>
                <p id="bookingMessage" role="status"></p>
            </form>
        </section>

        <section class="appointments-panel">
            <h2>قائمة الحجوزات</h2>
            <div class="booking-filters">
                <input id="filterDate" type="date">
                <select id="filterStatus">
                    <option value="">كل الحالات</option>
                    <option value="pending">قيد الانتظار</option>
                    <option value="confirmed">مؤكد</option>
                    <option value="completed">مكتمل</option>
                    <option value="cancelled">ملغي</option>
                </select>
            </div>
            <div id="bookingsList">جاري تحميل الحجوزات...</div>
        </section>
    </main>

    <script src="../js/appointments.js"></script>
    <script src="../js/theme.js"></script>
</body>
</html>
